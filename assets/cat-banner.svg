<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-labelledby="title desc">
  <title id="title">Four animated pixel cats in different poses</title>
  <desc id="desc">Four pixel cats with tuxedo, tabby, spotted, and color-point coats.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b14"/><stop offset=".5" stop-color="#0a1325"/><stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#3b82f6"/><stop offset="1" stop-color="#fb7449"/>
    </linearGradient>
    <filter id="pixelGlow" x="-70%" y="-120%" width="240%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="catHead" shape-rendering="crispEdges">
      <g fill="currentColor">
        <rect x="3" y="6" width="26" height="19"/>
        <rect x="6" y="3" width="7" height="7"/><rect x="20" y="3" width="7" height="7"/>
        <rect x="8" y="1" width="5" height="7"/><rect x="20" y="1" width="5" height="7"/>
      </g>
      <g fill="#ffb3aa" opacity=".78"><rect x="9" y="5" width="3" height="5"/><rect x="21" y="5" width="3" height="5"/></g>
      <g fill="#120b0b" opacity=".65"><rect x="10" y="7" width="3" height="6"/><rect x="15" y="6" width="3" height="7"/><rect x="20" y="7" width="3" height="6"/></g>
      <g>
        <rect x="8" y="13" width="7" height="6" fill="#dff68a"/><rect x="19" y="13" width="7" height="6" fill="#dff68a"/>
        <rect x="11" y="13" width="2" height="6" fill="#10150b"/><rect x="22" y="13" width="2" height="6" fill="#10150b"/>
        <rect x="9" y="13" width="2" height="2" fill="#fff"/><rect x="20" y="13" width="2" height="2" fill="#fff"/>
      </g>
      <g fill="#f4d2c4" opacity=".9"><rect x="9" y="19" width="8" height="5"/><rect x="17" y="19" width="8" height="5"/></g>
      <rect x="15" y="19" width="4" height="3" fill="#ff9894"/>
      <g fill="#dceeff"><rect x="0" y="20" width="10" height="1"/><rect x="24" y="20" width="10" height="1"/><rect x="1" y="23" width="9" height="1"/><rect x="24" y="23" width="9" height="1"/></g>
    </g>
    <g id="closedEyes" shape-rendering="crispEdges">
      <rect x="8" y="13" width="7" height="6" fill="currentColor"/><rect x="19" y="13" width="7" height="6" fill="currentColor"/>
      <rect x="8" y="16" width="7" height="2" fill="#170d0d"/><rect x="19" y="16" width="7" height="2" fill="#170d0d"/>
    </g>
  </defs>

  <rect x="1" y="1" width="958" height="148" rx="14" fill="url(#background)" stroke="url(#border)" stroke-width="2"/>

  <!-- independently twinkling pixel stars -->
  <g shape-rendering="crispEdges">
    <g fill="#2bd9ff">
      <rect x="38" y="22" width="3" height="3"><animate attributeName="opacity" values=".12;1;.12" dur="2.8s" begin="-.7s" repeatCount="indefinite"/></rect>
      <rect x="126" y="15" width="2" height="2"><animate attributeName="opacity" values="1;.08;1" dur="3.7s" begin="-2.1s" repeatCount="indefinite"/></rect>
      <rect x="212" y="40" width="3" height="3"><animate attributeName="opacity" values=".08;1;.08" dur="4.3s" begin="-1.3s" repeatCount="indefinite"/></rect>
      <rect x="296" y="21" width="2" height="2"><animate attributeName="opacity" values="1;.12;1" dur="3.1s" begin="-.4s" repeatCount="indefinite"/></rect>
      <rect x="384" y="34" width="3" height="3"><animate attributeName="opacity" values=".1;1;.1" dur="3.9s" begin="-2.8s" repeatCount="indefinite"/></rect>
      <rect x="470" y="17" width="2" height="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" begin="-1.5s" repeatCount="indefinite"/></rect>
      <rect x="548" y="46" width="3" height="3"><animate attributeName="opacity" values="1;.08;1" dur="4.8s" begin="-3.2s" repeatCount="indefinite"/></rect>
      <rect x="642" y="25" width="2" height="2"><animate attributeName="opacity" values=".08;1;.08" dur="3.4s" begin="-.9s" repeatCount="indefinite"/></rect>
      <rect x="714" y="15" width="3" height="3"><animate attributeName="opacity" values="1;.1;1" dur="4.1s" begin="-2.2s" repeatCount="indefinite"/></rect>
      <rect x="802" y="38" width="2" height="2"><animate attributeName="opacity" values=".12;1;.12" dur="2.6s" begin="-1.1s" repeatCount="indefinite"/></rect>
      <rect x="884" y="19" width="3" height="3"><animate attributeName="opacity" values="1;.08;1" dur="3.6s" begin="-2.5s" repeatCount="indefinite"/></rect>
      <rect x="926" y="54" width="2" height="2"><animate attributeName="opacity" values=".1;1;.1" dur="4.6s" begin="-1.8s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#5d7cff">
      <rect x="78" y="61" width="2" height="2"><animate attributeName="opacity" values=".08;.85;.08" dur="4.9s" begin="-3.4s" repeatCount="indefinite"/></rect>
      <rect x="256" y="70" width="3" height="3"><animate attributeName="opacity" values=".85;.08;.85" dur="3.3s" begin="-1.7s" repeatCount="indefinite"/></rect>
      <rect x="439" y="65" width="2" height="2"><animate attributeName="opacity" values=".08;.9;.08" dur="2.9s" begin="-.6s" repeatCount="indefinite"/></rect>
      <rect x="612" y="73" width="3" height="3"><animate attributeName="opacity" values=".9;.08;.9" dur="5.1s" begin="-4.2s" repeatCount="indefinite"/></rect>
      <rect x="756" y="66" width="2" height="2"><animate attributeName="opacity" values=".08;.85;.08" dur="3.8s" begin="-2.6s" repeatCount="indefinite"/></rect>
      <rect x="910" y="83" width="3" height="3"><animate attributeName="opacity" values=".85;.08;.85" dur="4.4s" begin="-1.2s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#ff8a5b">
      <rect x="174" y="29" width="2" height="2"><animate attributeName="opacity" values=".12;.9;.12" dur="4.2s" begin="-2.9s" repeatCount="indefinite"/></rect>
      <rect x="344" y="78" width="2" height="2"><animate attributeName="opacity" values=".9;.1;.9" dur="3.5s" begin="-.8s" repeatCount="indefinite"/></rect>
      <rect x="518" y="27" width="2" height="2"><animate attributeName="opacity" values=".1;.9;.1" dur="5.2s" begin="-3.6s" repeatCount="indefinite"/></rect>
      <rect x="684" y="57" width="2" height="2"><animate attributeName="opacity" values=".9;.12;.9" dur="2.7s" begin="-1.9s" repeatCount="indefinite"/></rect>
      <rect x="846" y="75" width="2" height="2"><animate attributeName="opacity" values=".12;.9;.12" dur="4.7s" begin="-3.1s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- 1: charcoal sitting cat -->
  <g transform="translate(95 39) scale(2)" color="#343844" shape-rendering="crispEdges">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" calcMode="discrete" dur="2.6s" repeatCount="indefinite"/>
      <g fill="currentColor"><rect x="14" y="24" width="23" height="26"/><rect x="9" y="34" width="16" height="16"/><rect x="8" y="47" width="20" height="5"/><rect x="29" y="47" width="14" height="5"/></g>
      <g fill="#e8edf2"><rect x="20" y="27" width="10" height="17"/><rect x="17" y="39" width="16" height="9"/><rect x="8" y="47" width="8" height="5"/><rect x="35" y="47" width="8" height="5"/></g>
      <g fill="currentColor">
        <g><animate attributeName="opacity" values="1;0;1" calcMode="discrete" dur="1.3s" repeatCount="indefinite"/><rect x="7" y="32" width="6" height="16"/><rect x="2" y="39" width="9" height="6"/><rect x="0" y="34" width="5" height="8"/></g>
        <g><animate attributeName="opacity" values="0;1;0" calcMode="discrete" dur="1.3s" repeatCount="indefinite"/><rect x="6" y="29" width="6" height="17"/><rect x="1" y="26" width="8" height="6"/><rect x="0" y="21" width="5" height="8"/></g>
      </g>
      <g transform="translate(9 0)">
        <use href="#catHead"/>
        <rect x="10" y="6" width="13" height="7" fill="currentColor"/>
        <rect x="15" y="6" width="4" height="7" fill="#e8edf2"/>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.86;.91;1" calcMode="discrete" dur="4.1s" begin="-.4s" repeatCount="indefinite"/>
          <use href="#closedEyes"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 2: orange loaf cat -->
  <g transform="translate(305 53) scale(2)" color="#e87532" shape-rendering="crispEdges">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" calcMode="discrete" dur="3.1s" repeatCount="indefinite"/>
      <g fill="currentColor"><rect x="7" y="24" width="45" height="19"/><rect x="12" y="20" width="31" height="24"/><rect x="4" y="38" width="51" height="7"/></g>
      <g fill="#110b0b" opacity=".55"><rect x="15" y="25" width="3" height="14"/><rect x="25" y="22" width="3" height="16"/><rect x="36" y="25" width="3" height="14"/></g>
      <g fill="currentColor"><rect x="0" y="31" width="7" height="12"/><rect x="3" y="41" width="18" height="5"/></g>
      <g transform="translate(29 3)">
        <use href="#catHead"/>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.88;.93;1" calcMode="discrete" dur="5.3s" begin="-2.1s" repeatCount="indefinite"/>
          <use href="#closedEyes"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 3: brown stretching cat -->
  <g transform="translate(520 41) scale(2)" color="#78401f" shape-rendering="crispEdges">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" calcMode="discrete" dur="2.2s" repeatCount="indefinite"/>
      <g fill="currentColor"><rect x="8" y="17" width="32" height="22"/><rect x="4" y="20" width="11" height="21"/><rect x="34" y="27" width="21" height="14"/></g>
      <g fill="#3a1f16" opacity=".9"><rect x="12" y="20" width="5" height="5"/><rect x="22" y="29" width="6" height="5"/><rect x="31" y="19" width="5" height="6"/><rect x="39" y="31" width="5" height="5"/><rect x="7" y="32" width="4" height="4"/></g>
      <g fill="currentColor"><rect x="7" y="38" width="6" height="14"/><rect x="49" y="38" width="6" height="13"/><rect x="54" y="47" width="10" height="5"/></g>
      <g fill="currentColor">
        <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" calcMode="discrete" dur="1.7s" repeatCount="indefinite"/>
        <rect x="1" y="7" width="6" height="18"/><rect x="0" y="3" width="6" height="8"/><rect x="3" y="0" width="7" height="6"/>
      </g>
      <g transform="translate(45 22) scale(.88)">
        <use href="#catHead"/>
        <rect x="10" y="6" width="13" height="7" fill="currentColor"/>
        <rect x="10" y="7" width="5" height="4" fill="#3a1f16"/><rect x="20" y="6" width="4" height="5" fill="#3a1f16"/>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.84;.89;1" calcMode="discrete" dur="4.7s" begin="-3.4s" repeatCount="indefinite"/>
          <use href="#closedEyes"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 4: cream playing cat -->
  <g transform="translate(884 48) scale(-2 2)" color="#d6b995" shape-rendering="crispEdges">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" calcMode="discrete" dur="1.9s" repeatCount="indefinite"/>
      <g fill="currentColor"><rect x="8" y="22" width="35" height="18"/><rect x="4" y="26" width="9" height="13"/></g>
      <g fill="#8a6d58" opacity=".95"><rect x="8" y="22" width="10" height="18"/><rect x="31" y="24" width="12" height="16"/><rect x="19" y="30" width="8" height="10"/></g>
      <g fill="currentColor"><rect x="8" y="38" width="6" height="12"/><rect x="34" y="38" width="6" height="9"/></g>
      <g fill="#70584a"><rect x="8" y="45" width="6" height="5"/><rect x="34" y="43" width="6" height="4"/></g>
      <g fill="#70584a">
        <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/>
        <rect x="38" y="38" width="17" height="5"/><rect x="51" y="35" width="6" height="8"/>
      </g>
      <g fill="#70584a"><rect x="2" y="19" width="6" height="11"/><rect x="0" y="14" width="5" height="9"/></g>
      <g transform="translate(36 5)">
        <use href="#catHead"/>
        <rect x="10" y="6" width="13" height="7" fill="#70584a"/>
        <rect x="15" y="8" width="4" height="5" fill="#4f4038"/>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.89;.94;1" calcMode="discrete" dur="5.9s" begin="-1.6s" repeatCount="indefinite"/>
          <use href="#closedEyes"/>
        </g>
      </g>
      <g fill="#2bd9ff" filter="url(#pixelGlow)">
        <rect x="61" y="38" width="5" height="5"><animate attributeName="y" values="38;34;38" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>

</svg>
